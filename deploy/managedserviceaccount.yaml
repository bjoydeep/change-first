# ManagedServiceAccount — creates a ServiceAccount for pr-analyzer on each
# managed cluster and syncs the token back to the hub as a Secret.
#
# The SA is created in open-cluster-management-agent-addon namespace on the spoke.
# The token is synced back to hub as Secret/{name} in the cluster's namespace.
#
# The ManifestWork grants view access to the SA on each managed cluster,
# enabling cluster-proxy reads for relationship checking.
#
# Apply: oc apply -f deploy/managedserviceaccount.yaml
---
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: pr-analyzer
  namespace: dsf-mc
spec:
  rotation:
    enabled: true
    validity: 720h0m0s
---
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: pr-analyzer-proxy-rbac
  namespace: dsf-mc
spec:
  workload:
    manifests:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: pr-analyzer-proxy-read
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: view
        subjects:
          - kind: ServiceAccount
            name: pr-analyzer
            namespace: open-cluster-management-agent-addon
---
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: pr-analyzer
  namespace: dsf-mc-02
spec:
  rotation:
    enabled: true
    validity: 720h0m0s
---
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: pr-analyzer-proxy-rbac
  namespace: dsf-mc-02
spec:
  workload:
    manifests:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: pr-analyzer-proxy-read
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: view
        subjects:
          - kind: ServiceAccount
            name: pr-analyzer
            namespace: open-cluster-management-agent-addon
---
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: pr-analyzer
  namespace: subbarao-hub
spec:
  rotation:
    enabled: true
    validity: 720h0m0s
---
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: pr-analyzer-proxy-rbac
  namespace: subbarao-hub
spec:
  workload:
    manifests:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: pr-analyzer-proxy-read
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: view
        subjects:
          - kind: ServiceAccount
            name: pr-analyzer
            namespace: open-cluster-management-agent-addon
